    organizations: { en: "The stewards: non-profits, public bodies, networks and citizen platforms working along the river.", ca: "Els guardians: entitats, administracions, xarxes i plataformes ciutadanes que treballen al llarg del riu.", es: "Los guardianes: entidades, administraciones, redes y plataformas ciudadanas que trabajan a lo largo del río." }
    programs: { en: "The alliances: from Simbiosi Fluvial to citizen science, water governance and river stewardship.", ca: "Les aliances: de Simbiosi Fluvial a la ciència ciutadana, la governança de l'aigua i la custòdia del riu.", es: "Las alianzas: de Simbiosi Fluvial a la ciencia ciudadana, la gobernanza del agua y la custodia del río." }
    events: { en: "Gatherings bound to the river and its governance, past and upcoming.", ca: "Trobades lligades al riu i a la seva governança, passades i properes.", es: "Encuentros ligados al río y a su gobernanza, pasados y próximos." }

  noteTitle: { en: "A live, provisional map", ca: "Un mapa viu i provisional", es: "Un mapa vivo y provisional" }
  noteBody:
    en: "This is a demonstration map prepared for the Simbiosi Fluvial community: a test of how the same Notion databases behind Regenerant Catalunya Maps can be re-read at watershed scale. Figures and institutional descriptions are working context, not verified publication copy — check them against primary sources before any external use."
    ca: "Aquest és un mapa de demostració preparat per a la comunitat de Simbiosi Fluvial: una prova de com les mateixes bases de dades de Notion que alimenten Regenerant Catalunya Maps es poden rellegir a escala de conca. Les xifres i les descripcions institucionals són context de treball, no text de publicació verificat — cal contrastar-les amb fonts primàries abans de qualsevol ús extern."
    es: "Este es un mapa de demostración preparado para la comunidad de Simbiosi Fluvial: una prueba de cómo las mismas bases de datos de Notion que alimentan Regenerant Catalunya Maps pueden releerse a escala de cuenca. Las cifras y las descripciones institucionales son contexto de trabajo, no texto de publicación verificado — conviene contrastarlas con fuentes primarias antes de cualquier uso externo."

priorities:
  eyebrow: { en: "Regenerant Catalunya Maps · Fluvià watershed", ca: "Regenerant Catalunya Maps · Conca del Fluvià", es: "Regenerant Catalunya Maps · Cuenca del Fluvià" }
  title: { en: "Six readings of the river's health", ca: "Sis lectures de la salut del riu", es: "Seis lecturas de la salud del río" }
  lede:
    en: "The same six systems that structure the Catalonia-wide diagnosis, read here as dimensions of one landscape's socio-ecological health — and of the community that holds it together."
    ca: "Els mateixos sis sistemes que estructuren el diagnòstic de tot Catalunya, llegits aquí com a dimensions de la salut socioecològica d'un sol paisatge — i de la comunitat que el sosté."
    es: "Los mismos seis sistemas que estructuran el diagnóstico de toda Cataluña, leídos aquí como dimensiones de la salud socioecológica de un solo paisaje — y de la comunidad que lo sostiene."
  howToRead:
    en: "This is a health check, not a menu. The Fluvià does not read budgets or comarcal boundaries: water quality depends on the riparian forest, the riparian forest depends on how the plain is farmed, and all of it depends on whether the municipalities and users of the basin can agree on anything at all. Each card states the current condition, the pressures that degrade it, what a healthier state would look like, and who is already working on it."
    ca: "Això és una revisió de salut, no un menú. El Fluvià no llegeix pressupostos ni límits comarcals: la qualitat de l'aigua depèn del bosc de ribera, el bosc de ribera depèn de com es conrea la plana, i tot plegat depèn de si els municipis i els usuaris de la conca són capaços de posar-se d'acord. Cada fitxa indica l'estat actual, les pressions que el degraden, com seria un estat més sa i qui ja hi està treballant."
    es: "Esto es una revisión de salud, no un menú. El Fluvià no lee presupuestos ni límites comarcales: la calidad del agua depende del bosque de ribera, el bosque de ribera depende de cómo se cultiva la llanura, y todo ello depende de si los municipios y usuarios de la cuenca son capaces de ponerse de acuerdo. Cada ficha indica el estado actual, las presiones que lo degradan, cómo sería un estado más sano y quién ya está trabajando en ello."
  scoreboardTitle: { en: "River landscape health check", ca: "Revisió de salut del paisatge fluvial", es: "Revisión de salud del paisaje fluvial" }
  detailTitle: { en: "The six dimensions", ca: "Les sis dimensions", es: "Las seis dimensiones" }
  stateLabel: { en: "Condition", ca: "Estat", es: "Estado" }
  signalLabel: { en: "Signal", ca: "Senyal", es: "Señal" }
  diagnosisLabel: { en: "Diagnosis", ca: "Diagnòstic", es: "Diagnóstico" }
  pressuresLabel: { en: "Pressures", ca: "Pressions", es: "Presiones" }
  healthyLabel: { en: "What a healthy river landscape looks like", ca: "Com seria un paisatge fluvial sa", es: "Cómo sería un paisaje fluvial sano" }
  whoLabel: { en: "Who is already working on it", ca: "Qui ja hi està treballant", es: "Quién ya está trabajando en ello" }
  whoEmpty: { en: "No actors or programs tagged with this dimension yet.", ca: "Encara no hi ha actors ni programes etiquetats amb aquesta dimensió.", es: "Todavía no hay actores ni programas etiquetados con esta dimensión." }
  actorsLabel: { en: "organizations", ca: "organitzacions", es: "organizaciones" }
  programsLabel: { en: "programs", ca: "programes", es: "programas" }
  fullAnalysis: { en: "Read the Catalonia-wide diagnosis of this priority →", ca: "Llegeix el diagnòstic d'aquesta prioritat per a tot Catalunya →", es: "Lee el diagnóstico de esta prioridad para toda Cataluña →" }
  interdependence:
    en: "Regenerating one of these dimensions regenerates the others. Restoring alder forest shades and cools the water; cooler water holds oxygen and life; a plain that keeps its nutrients needs less treatment downstream; a basin that decides its own water allocation can afford to leave environmental flows in the river. The inverse is also true, which is why fragmentation — ecological and institutional — is the basin's deepest problem."
    ca: "Regenerar una d'aquestes dimensions regenera les altres. Recuperar la verneda dona ombra i refreda l'aigua; l'aigua més freda reté oxigen i vida; una plana que reté els nutrients necessita menys tractament aigües avall; una conca que decideix la seva pròpia assignació d'aigua pot permetre's deixar cabals ecològics al riu. El contrari també és cert, i per això la fragmentació — ecològica i institucional — és el problema més profund de la conca."
    es: "Regenerar una de estas dimensiones regenera las demás. Recuperar la aliseda da sombra y enfría el agua; el agua más fría retiene oxígeno y vida; una llanura que retiene sus nutrientes necesita menos tratamiento aguas abajo; una cuenca que decide su propia asignación de agua puede permitirse dejar caudales ecológicos en el río. Lo contrario también es cierto, y por eso la fragmentación — ecológica e institucional — es el problema más profundo de la cuenca."
  statuses:
    under_strain: { en: "Under strain", ca: "Sota pressió", es: "Bajo presión" }
    fragile: { en: "Fragile, yet recoverable", ca: "Fragil, però recuperable", es: "Frágil, pero recuperable" }
    reversible: { en: "Reversible legacy", ca: "Llegat reversible", es: "Legado reversible" }
    emerging: { en: "Emerging", ca: "Emergent", es: "Emergente" }
  entries:
    water:
      status: under_strain
      signal:
        en: "Headwaters poor, middle and lower course mediocre (ACA); flow can fall by two-thirds in a month of drought."
        ca: "Capçalera dolenta, curs mitjà i baix mediocre (ACA); el cabal pot caure dues terceres parts en un mes de sequera."
        es: "Cabecera mala, curso medio y bajo mediocre (ACA); el caudal puede caer dos tercios en un mes de sequía."
      diagnosis:
        en: "The Fluvià is the only internal Catalan basin without a major dam and without large towns in its middle and lower reaches — a rare condition in the Mediterranean. That freedom is also fragility: the flow depends almost entirely on rainfall, drought stalls the water, eutrophication and invasive species advance, and farmland loads the river with nutrients. Weirs and small intakes break a river that still functions ecologically as a whole."
        ca: "El Fluvià és l'única conca interna catalana sense cap gran embassament i sense grans nuclis urbans al curs mitjà i baix — una condició rara a la Mediterrània. Aquesta llibertat també és fragilitat: el cabal depèn gairebé del tot de la pluja, la sequera estanca l'aigua, l'eutrofització i les espècies invasores avancen, i l'agricultura carrega el riu de nutrients. Rescloses i petites captures trenquen un riu que encara funciona ecològicament com un tot."
        es: "El Fluvià es la única cuenca interna catalana sin ningún gran embalse y sin grandes núcleos urbanos en su curso medio y bajo — una condición rara en el Mediterráneo. Esa libertad es también fragilidad: el caudal depende casi por completo de la lluvia, la sequía estanca el agua, la eutrofización y las especies invasoras avanzan, y la agricultura carga el río de nutrientes. Azudes y pequeñas captaciones rompen un río que todavía funciona ecológicamente como un todo."
      pressures:
        - { en: "Drought and flow stagnation", ca: "Sequera i estancament del cabal", es: "Sequía y estancamiento del caudal" }
        - { en: "Nutrient pollution and eutrophication", ca: "Contaminació per nutrients i eutrofització", es: "Contaminación por nutrientes y eutrofización" }
        - { en: "Invasive species", ca: "Espècies invasores", es: "Especies invasoras" }
        - { en: "Weirs breaking ecological continuity", ca: "Rescloses que trenquen la continuïtat ecològica", es: "Azudes que rompen la continuidad ecológica" }
      healthy:
        en: "Water that runs, connects and is shared: environmental flow regimes agreed between the ACA and water users, ecological continuity restored past obsolete barriers, and a basin community able to decide allocation in scarcity — the direction the Comunitat de l'Aigua in La Garrotxa is already testing."
        ca: "Aigua que corre, connecta i es comparteix: règims de cabal ecològic acordats entre l'ACA i els usuaris, continuïtat ecològica restaurada més enllà de les barreres obsoletes i una comunitat de conca capaç de decidir l'assignació en episodis d'escassetat — la direcció que ja assaja la Comunitat de l'Aigua de la Garrotxa."
        es: "Agua que corre, conecta y se comparte: regímenes de caudal ecológico acordados entre la ACA y los usuarios, continuidad ecológica restaurada más allá de las barreras obsoletas y una comunidad de cuenca capaz de decidir la asignación en episodios de escasez — la dirección que ya ensaya la Comunitat de l'Aigua de la Garrotxa."
    ecosystems:
      status: fragile
      signal:
        en: "Two priority habitats — alder forest and mixed deciduous forest with pedunculate oak — and threatened species: white-clawed crayfish, polecat, native mussels, otter."
        ca: "Dos hàbitats prioritaris — verneda i boscos caducifolis mixtos amb roure pènol — i espècies amenaçades: cranc de riu de potes blanques, turó, nàiades, llúdriga."
        es: "Dos hábitats prioritarios — aliseda y bosques caducifolios mixtos con roble pedunculado — y especies amenazadas: cangrejo de río de patas blancas, turón, náyades, nutria."
      diagnosis:
        en: "The basin links two protected landscapes — the volcanic zone at the headwaters and the Aiguamolls at the mouth — with the Riu Vell and the abandoned meanders protected as Natura 2000 wetlands. Between them, the riparian corridor is the ecological spine of the territory, and it is interrupted: gravel extraction reshapes the riverbed, invasive species displace native ones, and Catalan aquatic environments have lost up to 60% of their biodiversity in recent decades."
        ca: "La conca enllaça dos paisatges protegits — la zona volcànica a la capçalera i els Aiguamolls a la desembocadura — amb el Riu Vell i els meandres abandonats protegits com a zones humides Natura 2000. Entre ells, el corredor de ribera és la columna vertebral ecològica del territori, i està interromput: l'extracció de graves remodela el llit, les espècies invasores desplacen les natives i els ambients aquàtics catalans han perdut fins a un 60% de biodiversitat en les darreres dècades."
        es: "La cuenca enlaza dos paisajes protegidos — la zona volcánica en la cabecera y los Aiguamolls en la desembocadura — con el Riu Vell y los meandros abandonados protegidos como humedales Natura 2000. Entre ellos, el corredor de ribera es la columna vertebral ecológica del territorio, y está interrumpido: la extracción de gravas remodela el cauce, las especies invasoras desplazan a las nativas y los ambientes acuáticos catalanes han perdido hasta un 60% de biodiversidad en las últimas décadas."
      pressures:
        - { en: "Gravel extraction altering the riverbed", ca: "Extracció de graves que altera el llit", es: "Extracción de gravas que altera el cauce" }
        - { en: "Invasive species", ca: "Espècies invasores", es: "Especies invasoras" }
        - { en: "Discontinuous riparian corridor", ca: "Corredor de ribera discontinu", es: "Corredor de ribera discontinuo" }
        - { en: "Loss of aquatic biodiversity", ca: "Pèrdua de biodiversitat aquàtica", es: "Pérdida de biodiversidad acuática" }
      healthy:
        en: "A continuous corridor from the volcanoes to the sea: alder and oak forest recovering along the banks, stable populations of crayfish and native mussels, and the river's own endemic snail — Vilertia galeata, described in 2022 at Esponellà — as evidence that the Fluvià still creates life."
        ca: "Un corredor continu dels volcans al mar: vernedes i rouredes recuperant-se a les ribes, poblacions estables de cranc i nàiades, i el cargol endèmic del riu — Vilertia galeata, descrit el 2022 a Esponellà — com a prova que el Fluvià encara crea vida."
        es: "Un corredor continuo de los volcanes al mar: alisedas y robledales recuperándose en las riberas, poblaciones estables de cangrejo y náyades, y el caracol endémico del río — Vilertia galeata, descrito en 2022 en Esponellà — como prueba de que el Fluvià todavía crea vida."
    food:
      status: under_strain
      signal:
        en: "Farmland in the Pla de l'Estany and the Empordà plain shares the basin's water — and its nutrients."
        ca: "Les terres del Pla de l'Estany i de la plana empordanesa comparteixen l'aigua de la conca — i els seus nutrients."
        es: "Las tierras del Pla de l'Estany y de la llanura ampurdanesa comparten el agua de la cuenca — y sus nutrientes."
      diagnosis:
        en: "River and plain are one system. Nitrate runoff is one of the main pressures on water quality, and agriculture is also the first to lose when the river degrades: less water, poorer soil, less resilience. Because rainfall in the headwaters is relatively favourable, the Fluvià is little used for irrigation — so the question here is less about allocation and more about how the land is farmed."
        ca: "Riu i plana són un sol sistema. L'escolament de nitrats és una de les principals pressions sobre la qualitat de l'aigua, i l'agricultura és també la primera a perdre quan el riu es degrada: menys aigua, sòls més pobres, menys resiliència. Com que la pluviometria a la capçalera és relativament favorable, el Fluvià s'usa poc per a regadiu — així que la qüestió aquí no és tant el repartiment sinó com es conrea la terra."
        es: "Río y llanura son un solo sistema. La escorrentía de nitratos es una de las principales presiones sobre la calidad del agua, y la agricultura es también la primera en perder cuando el río se degrada: menos agua, suelos más pobres, menos resiliencia. Como la pluviometría en la cabecera es relativamente favorable, el Fluvià se usa poco para regadío — así que la cuestión aquí no es tanto el reparto sino cómo se cultiva la tierra."
      pressures:
        - { en: "Nitrate runoff and eutrophication", ca: "Escolament de nitrats i eutrofització", es: "Escorrentía de nitratos y eutrofización" }
        - { en: "Soil and water degradation", ca: "Degradació del sòl i de l'aigua", es: "Degradación del suelo y del agua" }
        - { en: "Loss of small farm viability", ca: "Pèrdua de viabilitat de la petita pagesia", es: "Pérdida de viabilidad de la pequeña agricultura" }
      healthy:
        en: "An agroecological mosaic in the plain that keeps nutrients in the soil: buffer strips and restored riverbanks, closed nutrient loops, short supply chains, and farmers recognised and supported as stewards of the watershed."
        ca: "Un mosaic agroecològic a la plana que reté els nutrients al sòl: franges de protecció i ribes restaurades, circuits tancats de nutrients, cadenes curtes i pagesia reconeguda i recolzada com a custòdia de la conca."
        es: "Un mosaico agroecológico en la llanura que retiene los nutrientes en el suelo: franjas de protección y riberas restauradas, circuitos cerrados de nutrientes, cadenas cortas y agricultura reconocida y apoyada como custodia de la cuenca."
    energy:
      status: reversible
      signal:
        en: "Small hydropower since the Serinyà weir of 1935; the Esponellà reservoir project was abandoned in the 1970s."
        ca: "Petita hidràulica des de la resclosa de Serinyà (1935); el projecte d'embassament d'Esponellà es va abandonar als anys setanta."
        es: "Pequeña hidráulica desde el azud de Serinyà (1935); el proyecto de embalse de Esponellà se abandonó en los años setenta."
      diagnosis:
        en: "The Fluvià powered textile and paper mills in Olot, Sant Joan les Fonts and Besalú, and still hosts small hydro plants at Serinyà and Esponellà. The great dam that would have flooded the plain was never built — one of the reasons the river keeps its shape. Today the question is not whether the basin produces energy, but how: flow regimes, fish passes and the removal of obsolete barriers decide whether generation is compatible with a living river."
        ca: "El Fluvià va moure fàbriques tèxtils i de paper a Olot, Sant Joan les Fonts i Besalú, i encara acull petites centrals hidroelèctriques a Serinyà i Esponellà. El gran embassament que hauria inundat la plana no es va arribar a construir — una de les raons per les quals el riu conserva la seva forma. Avui la qüestió no és si la conca produeix energia, sinó com: els règims de cabal, les escales de peixos i la retirada de barreres obsoletes decideixen si la generació és compatible amb un riu viu."
        es: "El Fluvià movió fábricas textiles y de papel en Olot, Sant Joan les Fonts y Besalú, y todavía alberga pequeñas centrales hidroeléctricas en Serinyà y Esponellà. El gran embalse que habría inundado la llanura nunca se construyó — una de las razones por las que el río conserva su forma. Hoy la cuestión no es si la cuenca produce energía, sino cómo: los regímenes de caudal, las escalas de peces y la retirada de barreras obsoletas deciden si la generación es compatible con un río vivo."
      pressures:
        - { en: "Weirs and intakes interrupting flow", ca: "Rescloses i captures que interrompen el cabal", es: "Azudes y captaciones que interrumpen el caudal" }
        - { en: "Energy demand competing for water", ca: "Demanda d'energia que competeix per l'aigua", es: "Demanda de energía que compite por el agua" }
        - { en: "Legacy infrastructure without ecological design", ca: "Infraestructura antiga sense disseny ecològic", es: "Infraestructura antigua sin diseño ecológico" }
      healthy:
        en: "Energy that respects the river: efficiency and community generation first, hydropower operated on ecological flow regimes, and barriers removed where they no longer serve a purpose."
        ca: "Energia que respecta el riu: eficiència i generació comunitària primer, hidroelèctrica operada amb règims de cabal ecològic i barreres retirades quan ja no compleixen cap funció."
        es: "Energía que respeta el río: eficiencia y generación comunitaria primero, hidroeléctrica operada con regímenes de caudal ecológico y barreras retiradas cuando ya no cumplen ninguna función."
    circular:
      status: reversible
      signal:
        en: "Gravel, wastewater and farm runoff are materials out of place in a river that should carry life, not load."
        ca: "Graves, aigües residuals i escolament agrícola són materials fora de lloc en un riu que hauria de portar vida, no càrrega."
        es: "Gravas, aguas residuales y escorrentía agrícola son materiales fuera de lugar en un río que debería llevar vida, no carga."
      diagnosis:
        en: "Circularity in the basin means closing three loops: nutrients — from farm runoff back into soil instead of into water; water — treatment, reuse and infiltration instead of discharge; and materials — gravel managed as part of the river's sediment regime rather than as a quarry. The ACA's own circular-water agenda reads at basin scale as one question: what still leaves the watershed as waste?"
        ca: "La circularitat a la conca vol dir tancar tres cicles: nutrients — de l'escolament agrícola al sòl en lloc de l'aigua; aigua — tractament, reutilització i infiltració en lloc d'abocament; i materials — graves gestionades com a part del règim de sediments del riu i no com una pedrera. L'agenda d'aigua circular de l'ACA, a escala de conca, es tradueix en una pregunta: què surt encara de la conca com a residu?"
        es: "La circularidad en la cuenca significa cerrar tres ciclos: nutrientes — de la escorrentía agrícola al suelo en lugar del agua; agua — tratamiento, reutilización e infiltración en lugar de vertido; y materiales — gravas gestionadas como parte del régimen de sedimentos del río y no como una cantera. La agenda de agua circular de la ACA, a escala de cuenca, se traduce en una pregunta: ¿qué sale todavía de la cuenca como residuo?"
      pressures:
        - { en: "Insufficient wastewater treatment", ca: "Tractament insuficient d'aigües residuals", es: "Tratamiento insuficiente de aguas residuales" }
        - { en: "Extractive gravel management", ca: "Gestió extractiva de les graves", es: "Gestión extractiva de las gravas" }
        - { en: "Nutrient leakage into the river", ca: "Fugida de nutrients cap al riu", es: "Fuga de nutrientes hacia el río" }
      healthy:
        en: "A basin that closes its loops: treated water returned clean or reused, nutrients captured in soil and biomass, and sediment managed as part of the river's own dynamics."
        ca: "Una conca que tanca els seus cicles: aigua tractada retornada neta o reutilitzada, nutrients capturats al sòl i a la biomassa, i sediments gestionats com a part de la dinàmica del propi riu."
        es: "Una cuenca que cierra sus ciclos: agua tratada devuelta limpia o reutilizada, nutrientes capturados en el suelo y en la biomasa, y sedimentos gestionados como parte de la dinámica del propio río."
    social:
      status: emerging
      signal:
        en: "More than 20 municipalities and four non-profits building a hydro-community: a watershed governed as a commons."
        ca: "Més de 20 municipis i quatre entitats construint una hidrocomunitat: una conca governada com un bé comú."
        es: "Más de 20 municipios y cuatro entidades construyendo una hidrocomunidad: una cuenca gobernada como un bien común."
      diagnosis:
        en: "The ecological health of the Fluvià depends on social health: who decides, who cares, who stays. The history is instructive — the Consorci del Fluvià (2011–2015) showed both the need for basin-scale coordination and how quickly it dissolves without durable funding. Today Simbiosi Fluvial, the county councils, the emerging water community in La Garrotxa and the grassroots platforms at the river mouth are rebuilding that capacity from the bottom up, with volunteering, citizen science and education as its base."
        ca: "La salut ecològica del Fluvià depèn de la salut social: qui decideix, qui cuida, qui es queda. La història és instructiva — el Consorci del Fluvià (2011–2015) va mostrar tant la necessitat de coordinar-se a escala de conca com la facilitat amb què es dissol sense finançament estable. Avui Simbiosi Fluvial, els consells comarcals, la incipient comunitat de l'aigua de la Garrotxa i les plataformes de la desembocadura reconstrueixen aquesta capacitat des de baix, amb el voluntariat, la ciència ciutadana i l'educació com a base."
        es: "La salud ecológica del Fluvià depende de la salud social: quién decide, quién cuida, quién se queda. La historia es instructiva — el Consorci del Fluvià (2011–2015) mostró tanto la necesidad de coordinarse a escala de cuenca como la facilidad con que se disuelve sin financiación estable. Hoy Simbiosi Fluvial, los consejos comarcales, la incipiente comunidad del agua de La Garrotxa y las plataformas de la desembocadura reconstruyen esa capacidad desde abajo, con el voluntariado, la ciencia ciudadana y la educación como base."
      pressures:
        - { en: "Coordination that depends on subsidies", ca: "Coordinació que depèn de subvencions", es: "Coordinación que depende de subvenciones" }
        - { en: "Fragmentation across three comarques and dozens of agencies", ca: "Fragmentació entre tres comarques i desenes d'organismes", es: "Fragmentación entre tres comarcas y decenas de organismos" }
        - { en: "Participation fatigue and electoral cycles", ca: "Fatiga participativa i cicles electorals", es: "Fatiga participativa y ciclos electorales" }
      healthy:
        en: "A hydro-community with an institution behind it: municipalities, farmers, water users, non-profits and public agencies sharing decisions that survive political change, and a river whose state is legible to everyone who lives along it."
        ca: "Una hidrocomunitat amb una institució al darrere: municipis, pagesia, usuaris de l'aigua, entitats i administracions compartint decisions que sobreviuen als canvis polítics, i un riu l'estat del qual és llegible per a tothom qui hi viu a prop."
        es: "Una hidrocomunidad con una institución detrás: municipios, agricultura, usuarios del agua, entidades y administraciones compartiendo decisiones que sobreviven a los cambios políticos, y un río cuyo estado es legible para todo el mundo que vive cerca."

