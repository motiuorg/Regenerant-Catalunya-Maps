  whyTitle: { en: "Why the Fluvià", ca: "Per què el Fluvià", es: "Por qué el Fluvià" }
  whyLede:
    en: "Simbiosi Fluvial describes it as the river in Europe with the greatest capacity to be regenerated and restored. Four conditions make that credible:"
    ca: "Simbiosi Fluvial el descriu com el riu d'Europa amb més capacitat de ser regenerat i restaurat. Quatre condicions ho fan creïble:"
    es: "Simbiosi Fluvial lo describe como el río de Europa con mayor capacidad de ser regenerado y restaurado. Cuatro condiciones lo hacen creíble:"
  reasons:
    - title: { en: "It still runs free", ca: "Encara corre lliure", es: "Todavía corre libre" }
      body:
        en: "It is the only Catalan river without large reservoirs along its course and without large urban settlements in its middle and lower reaches. The water is not stored, diverted or dammed at scale."
        ca: "És l'únic riu català sense grans embassaments al llarg del seu recorregut i sense grans nuclis urbans al curs mitjà i baix. L'aigua no s'embassa, no es desvia ni es represa a gran escala."
        es: "Es el único río catalán sin grandes embalses a lo largo de su recorrido y sin grandes núcleos urbanos en su curso medio y bajo. El agua no se embalsa, no se desvía ni se represa a gran escala."
    - title: { en: "Natura 2000, coast to coast", ca: "Natura 2000, de capçalera a desembocadura", es: "Natura 2000, de cabecera a desembocadura" }
      body:
        en: "Its headwaters rise inside the Garrotxa Volcanic Zone Natural Park and its mouth opens into the Aiguamolls de l'Empordà Natural Park. The old riverbed — the Riu Vell — and the abandoned meanders are protected wetlands and part of the Natura 2000 network."
        ca: "La capçalera neix dins del Parc Natural de la Zona Volcànica de la Garrotxa i la desembocadura s'obre al Parc Natural dels Aiguamolls de l'Empordà. El llit vell — el Riu Vell — i els meandres abandonats són zones humides protegides i formen part de la xarxa Natura 2000."
        es: "Su cabecera nace dentro del Parque Natural de la Zona Volcánica de la Garrotxa y su desembocadura se abre al Parque Natural dels Aiguamolls de l'Empordà. El cauce viejo — el Riu Vell — y los meandros abandonados son humedales protegidos y forman parte de la red Natura 2000."
    - title: { en: "The damage is reversible", ca: "El mal és reversible", es: "El daño es reversible" }
      body:
        en: "The pressures that degrade the Fluvià — nutrient pollution, weirs, gravel extraction, untreated discharges — are all reversible with coordinated restoration and stewardship. It is a river that can be brought back, not one that has to be defended as a ruin."
        ca: "Les pressions que degraden el Fluvià — contaminació per nutrients, rescloses, extracció de graves, abocaments no tractats — són reversibles amb restauració i custòdia coordinades. És un riu que es pot recuperar, no un riu que calgui defensar com una ruïna."
        es: "Las presiones que degradan el Fluvià — contaminación por nutrientes, azudes, extracción de gravas, vertidos sin tratar — son reversibles con restauración y custodia coordinadas. Es un río que se puede recuperar, no un río que haya que defender como una ruina."
    - title: { en: "A hydro-community is forming", ca: "S'està formant una hidrocomunitat", es: "Se está formando una hidrocomunidad" }
      body:
        en: "More than 20 municipalities, four non-profits, county councils and citizen platforms are experimenting with governing the watershed as a shared system — a governance laboratory that aims to outlive subsidy cycles and political change."
        ca: "Més de 20 municipis, quatre entitats sense ànim de lucre, consells comarcals i plataformes ciutadanes experimenten amb governar la conca com un sistema compartit — un laboratori de governança que vol sobreviure als cicles de subvenció i als canvis polítics."
        es: "Más de 20 municipios, cuatro entidades sin ánimo de lucro, consejos comarcales y plataformas ciudadanas experimentan con gobernar la cuenca como un sistema compartido — un laboratorio de gobernanza que quiere sobrevivir a los ciclos de subvención y a los cambios políticos."

  pressuresTitle: { en: "Pressures on the basin", ca: "Pressions sobre la conca", es: "Presiones sobre la cuenca" }
  pressuresLede:
    en: "The Catalan Water Agency classifies the ecological state of the river as poor in its headwaters and mediocre from Sant Joan les Fonts to the estuary. Biodiversity in Catalan aquatic environments has fallen by up to 60% in recent decades. Six pressures are named repeatedly:"
    ca: "L'Agència Catalana de l'Aigua classifica l'estat ecològic del riu com a dolent a la capçalera i mediocre de Sant Joan les Fonts fins a l'estuari. La biodiversitat dels ambients aquàtics catalans ha caigut fins a un 60% en les darreres dècades. Hi ha sis pressions que es repeteixen:"
    es: "La Agencia Catalana del Agua clasifica el estado ecológico del río como malo en su cabecera y mediocre desde Sant Joan les Fonts hasta el estuario. La biodiversidad de los ambientes acuáticos catalanes ha caído hasta un 60% en las últimas décadas. Se repiten seis presiones:"
  pressures:
    - title: { en: "Agricultural nitrates", ca: "Nitrats agrícoles", es: "Nitratos agrícolas" }
      body:
        en: "Runoff from farmland in the Pla de l'Estany and the Empordà plain feeds eutrophication and algal growth."
        ca: "L'escolament de les terres del Pla de l'Estany i de la plana empordanesa alimenta l'eutrofització i el creixement d'algues."
        es: "La escorrentía de las tierras del Pla de l'Estany y de la llanura ampurdanesa alimenta la eutrofización y el crecimiento de algas."
    - title: { en: "Gravel extraction", ca: "Extracció de graves", es: "Extracción de gravas" }
      body:
        en: "Extraction from the riverbed alters the sediment regime, the channel profile and the habitats that depend on them."
        ca: "L'extracció del llit altera el règim de sediments, el perfil del canal i els hàbitats que en depenen."
        es: "La extracción del cauce altera el régimen de sedimentos, el perfil del canal y los hábitats que dependen de ellos."
    - title: { en: "Gaps in wastewater treatment", ca: "Dèficits de sanejament", es: "Déficits de saneamiento" }
      body:
        en: "Some urban and industrial discharges, including around the river mouth, still reach the river insufficiently treated."
        ca: "Alguns abocaments urbans i industrials, també a prop de la desembocadura, arriben al riu sense tractament suficient."
        es: "Algunos vertidos urbanos e industriales, también cerca de la desembocadura, llegan al río sin tratamiento suficiente."
    - title: { en: "Interrupted connectivity", ca: "Connectivitat interrompuda", es: "Conectividad interrumpida" }
      body:
        en: "Weirs and small intakes break the continuity of the river and the movement of species such as the white-clawed crayfish and native mussels."
        ca: "Rescloses i petites captures trenquen la continuïtat del riu i el moviment d'espècies com el cranc de riu de potes blanques i les nàiades."
        es: "Azudes y pequeñas captaciones rompen la continuidad del río y el movimiento de especies como el cangrejo de río de patas blancas y las náyades."
    - title: { en: "Drought", ca: "Sequera", es: "Sequía" }
      body:
        en: "In dry periods the flow can drop by more than two-thirds within a single month, stalling the water and degrading its quality."
        ca: "En períodes secs el cabal pot caure més de dues terceres parts en un sol mes, estancant l'aigua i degradant-ne la qualitat."
        es: "En periodos secos el caudal puede caer más de dos tercios en un solo mes, estancando el agua y degradando su calidad."
    - title: { en: "Fragmented governance", ca: "Governança fragmentada", es: "Gobernanza fragmentada" }
      body:
        en: "Responsibility is split between municipalities, three county councils, the ACA and sectoral bodies that rarely coordinate with one another."
        ca: "La responsabilitat es reparteix entre municipis, tres consells comarcals, l'ACA i organismes sectorials que rarament es coordinen."
        es: "La responsabilidad se reparte entre municipios, tres consejos comarcales, la ACA y organismos sectoriales que rara vez se coordinan."

