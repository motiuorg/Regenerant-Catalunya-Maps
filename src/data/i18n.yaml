  filterSubcategory: { en: "Filter by subcategory", ca: "Filtra per subcategoria", es: "Filtrar por subcategoría" }
  bioSubcategories: { en: "Bioeconomy subcategories", ca: "Subcategories de bioeconomia", es: "Subcategorías de bioeconomía" }
  searchPlaceholder: { en: "Type an organization name…", ca: "Escriu el nom d'una organització…", es: "Escribe el nombre de una organización…" }
  count: { en: "Showing {shown} of {total} organizations", ca: "Es mostren {shown} de {total} organitzacions", es: "Mostrando {shown} de {total} organizaciones" }
