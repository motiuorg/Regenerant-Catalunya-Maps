bio:
  heroLede:
    en: "Bioeconomy is a subsector within the wider regeneration field in Catalunya. This page shows the Catalan entities building bio-based, circular, regenerative value chains using biological resources, at the intersection of environmental regeneration and biotech, life sciences, climate tech and agri-food tech."
    ca: "La bioeconomia és un subsector dins del camp més ampli de la regeneració a Catalunya. Aquesta pàgina mostra les entitats catalanes que construeixen cadenes de valor biològiques, circulars i regeneratives, a la intersecció de la regeneració ambiental amb la biotecnologia, les ciències de la vida, la tecnologia climàtica i l'agroalimentària."
    es: "La bioeconomía es un subsector dentro del campo más amplio de la regeneración en Cataluña. Esta página muestra las entidades catalanas que construyen cadenas de valor biológicas, circulares y regenerativas, en la intersección de la regeneración ambiental con la biotecnología, las ciencias de la vida, la tecnología climática y la agroalimentaria."
  heroLede2: { en: "Filter by subcategory or search by name to explore the map.", ca: "Filtra per subcategoria o cerca per nom per explorar el mapa.", es: "Filtra por subcategoría o busca por nombre para explorar el mapa." }
