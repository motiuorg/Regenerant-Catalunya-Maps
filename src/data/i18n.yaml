  part2: { en: "Part 2", ca: "Part 2", es: "Parte 2" }
  methodTitle: { en: "Method and provenance", ca: "Mètode i procedència", es: "Método y procedencia" }
  methodBody:
    en: "This page was drafted from a research file on ecological restoration and socio-environmental contribution in Catalunya (2026-08-11) and from the entity registry behind this map (ReFi BCN CRM). Every link was verified on 2026-08-11; where a domain could not be reached, the entity is mentioned in prose but not linked. Entity websites marked \"On the map\" come from the CRM records shown in the organizations directory. Part 2 is a dated snapshot of funding needs — asks change weekly, so each card carries a status and a source."
    ca: "Aquesta pàgina s'ha redactat a partir d'un fitxer de recerca sobre restauració ecològica i contribució socioambiental a Catalunya (11-08-2026) i del registre d'entitats que hi ha darrere d'aquest mapa (CRM de ReFi BCN). Tots els enllaços es van verificar l'11-08-2026; on un domini no era accessible, l'entitat es menciona en el text però no s'enllaça. Els webs d'entitats marcades com a «Al mapa» provenen dels registres del CRM que es mostren al directori d'organitzacions. La part 2 és una fotografia datada de les necessitats de finançament — les demandes canvien setmanalment, per això cada targeta porta un estat i una font."
    es: "Esta página se ha redactado a partir de un archivo de investigación sobre restauración ecológica y contribución socioambiental en Cataluña (11-08-2026) y del registro de entidades que hay detrás de este mapa (CRM de ReFi BCN). Todos los enlaces se verificaron el 11-08-2026; cuando un dominio no era accesible, la entidad se menciona en el texto pero no se enlaza. Los sitios web de entidades marcadas como «En el mapa» provienen de los registros del CRM que se muestran en el directorio de organizaciones. La parte 2 es una fotografía fechada de las necesidades de financiación — las demandas cambian semanalmente, por eso cada tarjeta lleva un estado y una fuente."
