pri:
  heroTitle: { en: "Six priorities for a living Catalunya", ca: "Sis prioritats per a una Catalunya viva", es: "Seis prioridades para una Cataluña viva" }
  heroLede:
    en: "A diagnosis of the bioregion across six interdependent systems, plus the leverage and capital vehicles that can move each toward regeneration."
    ca: "Un diagnòstic del bioregion a través de sis sistemes interdependent, més les palanques i els vehicles de capital que poden moure cadascun cap a la regeneració."
    es: "Un diagnóstico del biorregión a través de seis sistemas interdependientes, más las palancas y los vehículos de capital que pueden mover cada uno hacia la regeneración."
  scoreboard: { en: "Scoreboard", ca: "Marcador", es: "Marcador" }
  six: { en: "The six priorities", ca: "Les sis prioritats", es: "Las seis prioridades" }
  interdependence: { en: "Interdependence", ca: "Interdependència", es: "Interdependencia" }
  interdependenceLede:
    en: "The six priorities are not a menu. They are a system: restoring watersheds increases food resilience; reducing energy demand lowers pressure on water; social commons create the capacity to act across all of them."
    ca: "Les sis prioritats no són un menú. Són un sistema: restaurar les conques augmenta la resiliència alimentària; reduir la demanda energètica rebaixa la pressió sobre l'aigua; els comuns socials creen la capacitat d'actuar en totes."
    es: "Las seis prioridades no son un menú. Son un sistema: restaurar las cuencas aumenta la resiliencia alimentaria; reducir la demanda energética baja la presión sobre el agua; los comunes sociales crean la capacidad de actuar en todas."
  interdepCaption:
    en: "The six priorities compound. Restore watersheds → food resilience; reduce energy demand → less pressure on water; social commons → capacity to act across all."
    ca: "Les sis prioritats es combinen. Restaurar conques → resiliència alimentària; reduir la demanda energètica → menys pressió sobre l'aigua; comuns socials → capacitat d'actuar en totes."
    es: "Las seis prioridades se combinan. Restaurar cuencas → resiliencia alimentaria; reducir la demanda energética → menos presión sobre el agua; comunes sociales → capacidad de actuar en todas."
  interdepTitle:
    en: "Six priorities as an interdependent system"
    ca: "Sis prioritats com a sistema interdependent"
    es: "Seis prioridades como sistema interdependiente"
  moneyTitle: { en: "Where money should go", ca: "On ha d'anar el diner", es: "A dónde debería ir el dinero" }
  moneyLede:
    en: "Catalunya needs a layered capital stack: patient trusts and banks for land and infrastructure, venture studios for regenerative enterprises, and investment companies for larger blended portfolios."
    ca: "Catalunya necessita una pila de capital per capes: fideïcomisos i bancs pacients per a la terra i la infraestructura, venture studios per a les empreses regeneratives i empreses d'inversió per a carteres combinades més grans."
    es: "Cataluña necesita una pila de capital por capas: fideicomisos y bancos pacientes para la tierra y la infraestructura, venture studios para las empresas regenerativas y empresas de inversión para carteras combinadas más grandes."
  methodTitle: { en: "Method and provenance", ca: "Mètode i procedència", es: "Método y procedencia" }
  methodBody1:
    en: "The priorities were derived from ongoing research on the Catalan bioregion and from the actor database already mapped on this site. Every indicator shown carries a source, a date, and a confidence badge. Where data is missing, we say so."
    ca: "Les prioritats provenen de la recerca en curs sobre el bioregion català i de la base de dades d'actors ja mapejada en aquest web. Cada indicador porta una font, una data i una insígnia de confiança. On falten dades, ho diem."
    es: "Las prioridades provienen de la investigación en curso sobre el biorregión catalán y de la base de datos de actores ya mapeada en este sitio. Cada indicador lleva una fuente, una fecha y una insignia de confianza. Donde faltan datos, lo decimos."
  methodBody2:
    en: "Indicators will be refreshed on a schedule that matches their upstream source: daily for reservoir and weather data, monthly for many economic and environmental series, annually for census and survey-based indicators. The full snapshot is rebuilt every six hours via GitHub Actions."
    ca: "Els indicadors es refrescaran amb un calendari que coincideixi amb la seva font: diàriament per a dades d'embassaments i meteorològiques, mensualment per a moltes sèries econòmiques i ambientals, anualment per a indicadors censals i d'enquestes. La instantània completa es reconstruïx cada sis hores mitjançant GitHub Actions."
    es: "Los indicadores se actualizarán con un calendario que coincida con su fuente: diariamente para datos de embalses y meteorológicos, mensualmente para muchas series económicas y ambientales, anualmente para indicadores censales y de encuestas. La instantánea completa se reconstruye cada seis horas mediante GitHub Actions."
  audienceLabel: { en: "Reading this as:", ca: "Llegeix-ho com a:", es: "Léelo como:" }
  audience:
    public: { en: "Curious public", ca: "Públic general", es: "Público general" }
    funder: { en: "Funder", ca: "Finançador", es: "Financiador" }
    administration: { en: "Public administration", ca: "Administració pública", es: "Administración pública" }
    organiser: { en: "Movement / organiser", ca: "Moviment / organitzador", es: "Movimiento / organizador" }
  block:
    public:
      en: "This section shows where Catalunya is living beyond its limits, and what is already being done about it. The scoreboard below is the quickest way to see the state of the six priorities. The main source for this temporary, evolving categorization has been the <a href=\"https://degrowth.org/wp-content/uploads/2024/07/decreixement_ENG_3.pdf\">Catalunya de-growth analysis</a>."
      ca: "Aquesta secció mostra on Catalunya viu més enllà dels seus límits i què ja s'hi està fent. El marcador de sota és la manera més ràpida de veure l'estat de les sis prioritats. La font principal d'aquesta categorització temporal i en evolució ha estat l'<a href=\"https://degrowth.org/wp-content/uploads/2024/07/decreixement_ENG_3.pdf\">anàlisi del decreixement de Catalunya</a>."
      es: "Esta sección muestra dónde Cataluña vive más allá de sus límites y qué se está haciendo al respecto. El marcador de abajo es la forma más rápida de ver el estado de las seis prioridades. La fuente principal de esta categorización temporal y en evolución ha sido el <a href=\"https://degrowth.org/wp-content/uploads/2024/07/decreixement_ENG_3.pdf\">análisis del decrecimiento de Cataluña</a>."
  moneyBlock:
    public:
      en: "Public money, philanthropic grants, and private capital each have a place — but only when matched to the right time horizon, asset, and governance structure."
      ca: "El diner públic, les subvencions filantròpiques i el capital privat hi tenen cabuda — però només quan s'ajusten a l'horitzó temporal, l'actiu i l'estructura de governança adequats."
      es: "El dinero público, las subvenciones filantrópicas y el capital privado tienen cabida — pero solo cuando se ajustan al horizonte temporal, el activo y la estructura de gobernanza adecuados."
    funder:
      en: "The four BioFi vehicles are sized for different risk, return, and governance profiles. Detailed capital memos per priority are linked from each priority page."
      ca: "Els quatre vehicles BioFi estan dimensionats per a diferents perfils de risc, retorn i governança. Els memos de capital detallats per prioritat s'enllacen des de cada pàgina de prioritat."
      es: "Los cuatro vehículos BioFi están dimensionados para diferentes perfiles de riesgo, retorno y gobernanza. Los memos de capital detallados por prioridad se enlazan desde cada página de prioridad."
    administration:
      en: "Public co-investment and guarantees can crowd in private capital where market failures are highest — especially land, water, and social infrastructure."
      ca: "La co-inversió pública i les garanties poden atreure capital privat on les fallades de mercat són més grans — especialment terra, aigua i infraestructura social."
      es: "La coinversión pública y las garantías pueden atraer capital privado donde las fallas de mercado son mayores — especialmente tierra, agua e infraestructura social."
    organiser:
      en: "The capital stack is not neutral. Trusts and commons institutions keep assets out of speculative markets; banks and venture instruments must be designed to reinforce, not extract from, the underlying commons."
      ca: "La pila de capital no és neutral. Els fideïcomisos i les institucions de comuns mantenen els actius fora dels mercats especulatius; els bancs i els instruments de risc s'han de dissenyar per reforçar, no extreure, els comuns subjacents."
      es: "La pila de capital no es neutral. Los fideicomisos y las instituciones de comunes mantienen los activos fuera de los mercados especulativos; los bancos y los instrumentos de riesgo deben diseñarse para reforzar, no extraer, los comunes subyacentes."

