schema_version: "1.0"

# Part 2 — Funding needs of restoration initiatives in Catalunya.
# Dated snapshot (verified 2026-08-11). Sources: research file
# "restauracio-ecologica-catalunya.md" (2026-08-11), ACA blog, XCN news, Gencat
# Registre/Custodia pages, donantambiental.cat, goteo.org, projecterius.cat,
# eixarcolant.cat. Asks change fast — every card carries a status.
#
# Status values: running | open-ask | funded | closed.

title:
  en: "Part 2 — Funding needs of restoration initiatives"
  ca: "Part 2 — Necessitats de finançament de les iniciatives de restauració"
  es: "Parte 2 — Necesidades de financiación de las iniciativas de restauración"

intro:
  en: >-
    This section maps the money side of ecological restoration in Catalunya: what is
    being funded, what is asking for support right now, and where the visible gaps are.
    Figures come from the sources cited on each card and were verified on 2026-08-11;
    restoration asks change quickly, so treat this as a dated snapshot. Part 1 above
    explains the channels (time, attention, money, land, capital) — Part 2 points those
    channels at specific initiatives.
  ca: >-
    Aquesta secció cartografia la part monetària de la restauració ecològica a
    Catalunya: què s'està finançant, què demana suport ara mateix i on són els buits
    visibles. Les xifres provenen de les fonts citades a cada targeta i es van verificar
    l'11 d'agost de 2026; les demandes de restauració canvien ràpid, per tant tracta-ho
    com una fotografia datada. La part 1 explica els canals (temps, atenció, diners,
    terra, capital) — la part 2 apunta aquests canals a iniciatives concretes.
  es: >-
    Esta sección cartografía la parte monetaria de la restauración ecológica en
    Cataluña: qué se está financiando, qué pide apoyo ahora mismo y dónde están los vacíos
    visibles. Las cifras provienen de las fuentes citadas en cada tarjeta y se verificaron
    el 11 de agosto de 2026; las demandas de restauración cambian rápido, por tanto trátalo
    como una fotografía fechada. La parte 1 explica los canales (tiempo, atención, dinero,
    tierra, capital) — la parte 2 apunta esos canales a iniciativas concretas.

